name: Publish Orchestration Agent Skill v0.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-agent-skill-v0.2.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ilyasclick/orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify immutable protocol and package metadata
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 93a0f9ed6496bf2ba296c1c94e41b145d2b7b10d HEAD -- Orchestration/protocol
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.')
          m = json.loads((p / 'plugin.json').read_text())
          assert m['name'] == 'orchestration'
          assert m['version'] == '0.2.0'
          assert (p / 'skills/orchestration/SKILL.md').is_file()
          assert (p / 'skills/orchestration/LICENSE').read_bytes() == (p / 'LICENSE').read_bytes()
          for f in ('references/DISTRIBUTION.md', 'references/HOST-CAPABILITIES.md'):
              assert (p / 'skills/orchestration' / f).is_file()
          assert 'Production STABLE version: `0.4.3`' in (p / 'Orchestration/protocol/CURRENT.md').read_text()
          print('Release source and protocol guard: PASS')
          PY

      - name: Build standalone Skill and Agent Plugin archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          skill = Path('skills/orchestration')
          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          archives = [
              (dist / 'orchestration-skill-v0.2.0.zip', [(f, 'orchestration/' + f.relative_to(skill).as_posix()) for f in sorted(skill.rglob('*')) if f.is_file()]),
              (dist / 'orchestration-plugin-v0.2.0.zip', [(Path('plugin.json'), 'plugin.json'), (Path('LICENSE'), 'LICENSE')] + [(f, f.as_posix()) for f in sorted(skill.rglob('*')) if f.is_file()]),
          ]
          checksums = []
          for archive, files in archives:
              with ZipFile(archive, 'w', ZIP_DEFLATED) as z:
                  for source, dest in files:
                      z.write(source, dest)
              with ZipFile(archive) as z:
                  assert z.testzip() is None
              checksums.append(f'{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}')
          (dist / 'SHA256SUMS.txt').write_text(chr(10).join(checksums) + chr(10))
          print('Archive integrity: PASS')
          PY

      - name: Create or complete GitHub Skill release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 dist/orchestration-skill-v0.2.0.zip dist/orchestration-plugin-v0.2.0.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create v0.2.0 dist/orchestration-skill-v0.2.0.zip dist/orchestration-plugin-v0.2.0.zip dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Orchestration Agent Skill v0.2.0" \
              --notes "First versioned Agent Skills release. Canonical entry: skills/orchestration/SKILL.md. Includes standalone Skill and Agent Plugins archives. Protocol remains 0.4.3 STABLE. Source-available license (not OSI open source). Installation and rollback: SKILL_INSTALL.md."
          fi
          gh release view v0.2.0 --json tagName,isDraft,isPrerelease,url,assets --jq '{tagName,isDraft,isPrerelease,url,assets:[.assets[].name]}'

      - name: Attempt Agent Skills repository topic
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/topics" > /tmp/current-topics.json
          jq '{names: ((.names + ["agent-skills"]) | unique)}' /tmp/current-topics.json > /tmp/new-topics.json
          gh api -X PUT "repos/$GITHUB_REPOSITORY/topics" --input /tmp/new-topics.json
